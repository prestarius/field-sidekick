name: x1-kali-field
description: Desired state for the X1 Kali field workstation and security lab.
target: ThinkPad X1 running Kali Linux
modules:
  system:
    enabled: true
    settings: {distribution: kali, update_policy: manual}
  dev:
    enabled: true
    settings: {python: ">=3.13", tools: [git, uv, docker]}
  network:
    enabled: true
    settings: {require_default_route: true}
  wireless:
    enabled: true
    settings: {adapter: Alfa AWUS036ACM, chipset: MT7612U}
  ai: {enabled: true, settings: {tooling: documented-opt-in}}
  tailscale: {enabled: true, settings: {desired: connected}}
  syncthing: {enabled: true, settings: {desired: enabled}}
  esp32: {enabled: true, settings: {tooling: platformio}}
  firefox: {enabled: true, settings: {profile_policy: documented-only}}
  obsidian: {enabled: true, settings: {vault_policy: user-managed}}
  opsec: {enabled: true, settings: {checklist: required-before-field-use}}

name: Bug report
description: Report reproducible behavior that differs from the documented intent.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, tokens, private paths, target data, or vulnerability details. See SECURITY.md for security reports."
  - type: input
    id: version
    attributes:
      label: field-sidekick version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: "For example: Kali Linux version, or macOS development host."
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and selected profile scope
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true

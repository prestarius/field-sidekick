name: Feature request
description: Propose a narrowly scoped improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Keep requests local, explicit, and safe. Do not include sensitive operational details."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What repeatable workstation problem would this solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: "Describe the local state, plan output, confirmation, and manual boundary."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true

name: x1-kali-field
description: Desired state for the X1 Kali field workstation and security lab.
target: ThinkPad X1 running Kali Linux
include:
  - ../packages/core.yaml
  - ../packages/dev.yaml
  - ../packages/networking.yaml
  - ../packages/wireless.yaml
  - ../packages/security.yaml
  - ../packages/esp32.yaml
  - ../apps/ai.yaml
  - ../apps/tailscale.yaml
  - ../apps/syncthing.yaml
  - ../apps/firefox.yaml
  - ../apps/obsidian.yaml
  - ../apps/opsec.yaml
  - ../apps/wormhole.yaml
  - ../apps/editors.yaml
modules:
  system: {enabled: true, settings: {distribution: kali, update_policy: manual}}
  dev: {enabled: true, settings: {python: ">=3.13"}}
  network: {enabled: true, settings: {require_default_route: true}}
  wireless: {enabled: true, settings: {adapter: Alfa AWUS036ACM, chipset: MT7612U}}
